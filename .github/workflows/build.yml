name: Build Kivy APK with Cache

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: buildozer-cache
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-

      - name: Prepare cache dir with writable permissions
        run: |
          mkdir -p buildozer-cache
          chmod -R 777 buildozer-cache

      - name: Build with Buildozer
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/home/user/hostcwd \
            -v "$GITHUB_WORKSPACE/buildozer-cache":/home/user/.buildozer \
            kivy/buildozer:1.5.0 \
            buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: betting-pro-apk
          path: bin/*.apk
