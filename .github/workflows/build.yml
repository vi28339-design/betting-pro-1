name: Build Kivy APK with Cache

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ ШАГ 1: Кэшируем глобальную папку Buildozer (SDK и NDK)
      # Это самый важный шаг для ускорения. Ключ кэша зависит от файла buildozer.spec.
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: .buildozer_global
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-

      # ✅ ШАГ 2: Собираем APK с помощью готового экшена
      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer -v android debug
          buildozer_version: stable

      # ✅ ШАГ 3: Загружаем готовый APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: betting-pro-apk
          path: ${{ steps.buildozer.outputs.filename }}
