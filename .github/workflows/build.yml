name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest  # ✅ Официальный Docker-образ с готовым SDK/NDK

    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        run: |
          # Очищаем кэш на всякий случай
          rm -rf ~/.buildozer
          rm -rf .buildozer
          
          # Запускаем сборку
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: betting-pro-apk
          path: bin/*.apk
